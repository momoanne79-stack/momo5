<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>수리나무학원 문법 - Unit27~28 to부정사</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root { --main:#1a5c9a; --accent:#f5a623; --bg:#f3f8ff; --soft:#eef7ff; --text:#122033; --green:#22a06b; --red:#e5534b; --line:#d3e6f7; --dark:#0d3458; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; }
body { padding:14px; background:var(--bg); color:var(--text); font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif; overscroll-behavior-y:contain; }
#app { max-width:520px; margin:0 auto; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 12px 32px rgba(26,92,154,.18); position:relative; padding-bottom:18px; }
.header { background:linear-gradient(135deg,var(--main),var(--dark)); color:white; text-align:center; padding:24px 16px 16px; }
.header .label { display:inline-block; background:var(--accent); color:#432700; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:900; margin-bottom:8px; }
.header h1 { margin:4px 0 4px; font-size:22px; line-height:1.25; }
.header p { margin:0; opacity:.9; font-size:13px; font-weight:800; }
.nav { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px; background:#f7fbff; position:sticky; top:0; z-index:10; border-bottom:1px solid #e4eef8; }
.nav button { width:100%; min-height:52px; border:0; border-radius:13px; background:#e8f1fa; color:#24445f; font-weight:900; font-size:13px; cursor:pointer; touch-action:manipulation; }
.nav button.active { background:var(--main); color:white; box-shadow:0 4px 12px rgba(26,92,154,.25); }
.section { display:none; padding:16px; }
.section.active { display:block; animation:fade .23s ease; }
@keyframes fade { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:none} }
.card { border:1.5px solid var(--line); border-radius:18px; padding:15px; margin-bottom:12px; background:#fff; }
.soft { background:var(--soft); border-color:#c4ddf4; }
.title { color:var(--main); font-size:18px; font-weight:900; margin:0 0 8px; }
.sub { color:#60758a; font-size:13px; font-weight:800; line-height:1.55; }
.status { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.badge { display:inline-block; background:#e8f1fa; color:#24445f; border-radius:999px; padding:7px 11px; font-size:13px; font-weight:900; }
.progress { height:12px; background:#dbeefa; border-radius:999px; overflow:hidden; margin-top:9px; }
.bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--main)); transition:.35s; }
.koBox { background:#eef7ff; border-left:5px solid var(--main); border-radius:15px; padding:15px; font-weight:900; line-height:1.65; color:#0e3758; margin-bottom:10px; font-size:17px; }
.usageBox { background:#fff8e8; border:1.5px solid #f5d28b; color:#5b4300; border-radius:14px; padding:12px; line-height:1.55; font-size:14px; font-weight:900; margin-bottom:10px; }
.tip { background:#f8fbff; border:1.5px solid #e4eef8; color:#40576b; border-radius:13px; padding:10px; line-height:1.45; font-size:13px; font-weight:800; margin:8px 0 12px; }
.answerArea, .wordBank { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; min-height:64px; border-radius:15px; padding:11px; margin-bottom:10px; }
.answerArea { border:2px dashed var(--main); background:#eef7ff; }
.wordBank { border:2px solid #e6eef6; background:#f8fbff; }
.chip { border:2px solid #b8d6ef; background:white; border-radius:12px; padding:11px 14px; font-weight:900; font-size:16px; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; line-height:1.15; }
.chip:active { transform:scale(.97); }
.sortable-ghost { opacity:.35; background:#edf2f7!important; }
.sortable-drag { background:var(--main)!important; color:white!important; transform:scale(1.06)!important; }
.resultBox { display:none; border-radius:15px; padding:13px; margin:10px 0; font-weight:900; text-align:center; line-height:1.55; }
.resultBox.ok { display:block; background:#e8fff4; border:2px solid var(--green); color:#11623d; animation:okflash .75s ease; }
.resultBox.no { display:block; background:#fff0f0; border:2px solid var(--red); color:#b63530; }
@keyframes okflash { 0%{transform:scale(.96); opacity:.35} 45%{transform:scale(1.04); opacity:1} 100%{transform:scale(1); opacity:1} }
.okMark { font-size:2.3rem; font-weight:1000; letter-spacing:1px; }
button.primary { width:100%; border:0; border-radius:14px; min-height:54px; padding:14px 12px; font-weight:900; font-size:17px; cursor:pointer; background:var(--main); color:#fff; margin-top:8px; touch-action:manipulation; }
button.secondary { width:100%; border:0; border-radius:14px; min-height:50px; padding:13px 12px; font-weight:900; font-size:15px; cursor:pointer; background:#e8f1fa; color:#24445f; margin-top:8px; touch-action:manipulation; }
.smallBtn { border:0; border-radius:11px; background:#e8f1fa; padding:10px 13px; font-weight:900; cursor:pointer; color:#24445f; touch-action:manipulation; }
.nextBtn { display:none; }
.finishIcon { font-size:3.4rem; text-align:center; margin-bottom:8px; }
.histRow,.wrongRow { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#f8fbff; border:1.5px solid #e4eef8; border-radius:15px; padding:13px; margin-bottom:10px; }
.histRow b,.wrongRow b { color:var(--main); }
.danger { background:var(--red)!important; color:white!important; }
#combo { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%) scale(.5); font-size:2.4rem; font-weight:1000; color:var(--accent); text-shadow:0 3px 10px rgba(245,166,35,.45); opacity:0; pointer-events:none; z-index:99; }
.combo-pop { animation:comboAnim .85s cubic-bezier(.17,.89,.32,1.27) forwards; }
@keyframes comboAnim { 0%{opacity:0;transform:translate(-50%,-30%) scale(.5)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)} 80%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-60%) scale(.8)} }
@media(max-width:390px) { body{padding:10px} .header h1{font-size:20px} .nav button{font-size:12px;min-height:50px} .chip{font-size:15px;padding:10px 12px} .koBox{font-size:16px} }
</style>
</head>
<body>
<div id="app">
  <div id="combo"></div>
  <div class="header"><span class="label">수리나무학원 문법</span><h1>Unit27~28 to부정사</h1><p>한글 해석 → 영어 문장 언스크램블</p></div>
  <div class="nav">
    <button id="tab-u27" class="active" onclick="showUnit('u27',this)">Unit27</button>
    <button id="tab-u28" onclick="showUnit('u28',this)">Unit28</button>
    <button id="tab-hist" onclick="showHistoryTab(this)">기록</button>
    <button id="tab-wrong" onclick="showWrongTab(this)">오답</button>

  <section id="quizSec" class="section active">
    <div id="introCard" class="card soft">
      <div class="title" id="unitTitle">Unit27</div>
      <div class="sub" id="unitSub"></div>
      <button class="primary" onclick="startCurrentUnit()">시작 / 이어풀기</button>

      <div class="usageBox" id="usageBox"></div>
      <div class="tip">💡 단어를 터치해 위/아래로 이동하거나, 꾹 눌러 드래그로 순서를 바꿔요. 모든 단어를 올리면 자동으로 확인됩니다.</div>
      <div id="answer-area" class="answerArea"></div>
      <div id="scramble-area" class="wordBank"></div>
      <div id="resultBox" class="resultBox"></div>
      <button id="nextBtn" class="primary nextBtn" onclick="nextQuestion()">다음 문제 ➜</button>
    </div>
    <div id="finishBox" class="card soft" style="display:none"></div>
  </section>

  <section id="histSec" class="section"><div class="title">학습 기록</div><div class="sub" style="margin-bottom:12px">풀다가 나가도 맞힌 문제와 오답이 저장됩니다.</div><div id="histList"></div><button class="secondary danger" onclick="resetAll()">기록 전체 초기화</button></section>
  <section id="wrongSec" class="section"><div class="title">오답 다시 풀기</div><div class="sub" style="margin-bottom:12px">틀린 문제는 여기 남고, 다시 맞히면 제거됩니다.</div><div id="wrongList"></div></section>
</div>
<script>
const STORE='sr_infinitive_unit27_28_clean_v2';
const UNITS=[{"id": "u27", "title": "Unit27", "subtitle": "to부정사의 명사적 용법", "items": [{"id": "u27-a1", "sec": "A-1", "en": "It is good to walk every day.", "ko": "매일 걷는 것은 좋다.", "use": "1. 명사적용법", "phrase": "to walk every day", "note": "가주어 It, 진주어 to walk every day", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-a2", "sec": "A-2", "en": "Andrew likes to ride his bike.", "ko": "Andrew는 자전거 타는 것을 좋아한다.", "use": "1. 명사적용법", "phrase": "to ride his bike", "note": "동사 likes의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-a3", "sec": "A-3", "en": "To write a diary every day is difficult.", "ko": "매일 일기를 쓰는 것은 어렵다.", "use": "1. 명사적용법", "phrase": "To write a diary every day", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-a4", "sec": "A-4", "en": "My goal is to travel around the world.", "ko": "나의 목표는 세계를 여행하는 것이다.", "use": "1. 명사적용법", "phrase": "to travel around the world", "note": "보어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-a5", "sec": "A-5", "en": "It is hard not to spend money.", "ko": "돈을 쓰지 않는 것은 어렵다.", "use": "1. 명사적용법", "phrase": "not to spend money", "note": "가주어 It, 진주어 not to spend money", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-b1", "sec": "B-1", "en": "To get enough sleep is important.", "ko": "충분한 잠을 자는 것은 중요하다.", "use": "1. 명사적용법", "phrase": "To get enough sleep", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-b2", "sec": "B-2", "en": "To watch videos on YouTube is fun.", "ko": "유튜브에서 영상을 보는 것은 재미있다.", "use": "1. 명사적용법", "phrase": "To watch videos on YouTube", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-b3", "sec": "B-3", "en": "To beat him at chess is impossible.", "ko": "체스에서 그를 이기는 것은 불가능하다.", "use": "1. 명사적용법", "phrase": "To beat him at chess", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-b4", "sec": "B-4", "en": "To play this board game is exciting.", "ko": "이 보드게임을 하는 것은 신난다.", "use": "1. 명사적용법", "phrase": "To play this board game", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-c1", "sec": "C-1", "en": "Peter wants to know her name.", "ko": "Peter는 그녀의 이름을 알고 싶어 한다.", "use": "1. 명사적용법", "phrase": "to know her name", "note": "동사 wants의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-c2", "sec": "C-2", "en": "I decided to lose some weight.", "ko": "나는 살을 좀 빼기로 결심했다.", "use": "1. 명사적용법", "phrase": "to lose some weight", "note": "동사 decided의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-c3", "sec": "C-3", "en": "She promised not to lie again.", "ko": "그녀는 다시는 거짓말하지 않겠다고 약속했다.", "use": "1. 명사적용법", "phrase": "not to lie again", "note": "동사 promised의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-c4", "sec": "C-4", "en": "Frank planned to go on a picnic.", "ko": "Frank는 소풍 가기로 계획했다.", "use": "1. 명사적용법", "phrase": "to go on a picnic", "note": "동사 planned의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-c5", "sec": "C-5", "en": "He will tell us how to use it.", "ko": "그는 우리에게 그것을 어떻게 사용하는지 알려 줄 것이다.", "use": "1. 명사적용법", "phrase": "how to use it", "note": "의문사 how + to부정사가 명사구 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-d1", "sec": "D-1", "en": "Jessica needs to fix her bike.", "ko": "Jessica는 그녀의 자전거를 고칠 필요가 있다.", "use": "1. 명사적용법", "phrase": "to fix her bike", "note": "동사 needs의 목적어", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-d2", "sec": "D-2", "en": "Ted's dream is to become a firefighter.", "ko": "Ted의 꿈은 소방관이 되는 것이다.", "use": "1. 명사적용법", "phrase": "to become a firefighter", "note": "보어 역할", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-d3", "sec": "D-3", "en": "It is dangerous to drive when sleepy.", "ko": "졸릴 때 운전하는 것은 위험하다.", "use": "1. 명사적용법", "phrase": "to drive when sleepy", "note": "가주어 It, 진주어 to drive", "unitId": "u27", "unitTitle": "Unit27"}, {"id": "u27-d4", "sec": "D-4", "en": "To eat breakfast is good for your health.", "ko": "아침을 먹는 것은 건강에 좋다.", "use": "1. 명사적용법", "phrase": "To eat breakfast", "note": "문장의 주어 역할", "unitId": "u27", "unitTitle": "Unit27"}]}, {"id": "u28", "title": "Unit28", "subtitle": "to부정사의 형용사·부사적 용법", "items": [{"id": "u28-a1", "sec": "A-1", "en": "There are many museums to visit in London.", "ko": "런던에는 방문할 박물관이 많다.", "use": "2. 형용사적용법", "phrase": "to visit in London", "note": "앞의 명사 museums를 꾸밈", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-a2", "sec": "A-2", "en": "She saved money to buy a new bicycle.", "ko": "그녀는 새 자전거를 사기 위해 돈을 모았다.", "use": "3. 부사적용법(목적)", "phrase": "to buy a new bicycle", "note": "돈을 모은 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-a3", "sec": "A-3", "en": "He went to the Philippines to learn English.", "ko": "그는 영어를 배우기 위해 필리핀에 갔다.", "use": "3. 부사적용법(목적)", "phrase": "to learn English", "note": "필리핀에 간 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-a4", "sec": "A-4", "en": "Dave bought some fruit to make juice.", "ko": "Dave는 주스를 만들기 위해 과일을 좀 샀다.", "use": "3. 부사적용법(목적)", "phrase": "to make juice", "note": "과일을 산 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-a5", "sec": "A-5", "en": "We need some time to think about our plan.", "ko": "우리는 우리의 계획에 대해 생각할 시간이 좀 필요하다.", "use": "2. 형용사적용법", "phrase": "to think about our plan", "note": "앞의 명사 time을 꾸밈", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-b1", "sec": "B-1", "en": "There is something to drink in the refrigerator.", "ko": "냉장고 안에 마실 것이 있다.", "use": "2. 형용사적용법", "phrase": "to drink", "note": "앞의 명사 something을 꾸밈", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-b2", "sec": "B-2", "en": "I am going to the bakery to buy a cake.", "ko": "나는 케이크를 사기 위해 빵집에 가는 중이다.", "use": "3. 부사적용법(목적)", "phrase": "to buy a cake", "note": "빵집에 가는 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-b3", "sec": "B-3", "en": "I am sorry to hear that.", "ko": "그 말을 듣게 되어 유감이야.", "use": "5. 부사적용법(원인)", "phrase": "to hear that", "note": "감정 sorry의 원인", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-b4", "sec": "B-4", "en": "I have a lot of work to do.", "ko": "나는 해야 할 일이 많다.", "use": "2. 형용사적용법", "phrase": "to do", "note": "앞의 명사 work를 꾸밈", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-c1", "sec": "C-1", "en": "He was disappointed to fail the exam.", "ko": "그는 시험에 떨어져서 실망했다.", "use": "5. 부사적용법(원인)", "phrase": "to fail the exam", "note": "감정 disappointed의 원인", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-c2", "sec": "C-2", "en": "Amy raised her hand to ask a question.", "ko": "Amy는 질문하기 위해 손을 들었다.", "use": "3. 부사적용법(목적)", "phrase": "to ask a question", "note": "손을 든 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-c3", "sec": "C-3", "en": "One morning he awoke to find himself lonely.", "ko": "어느 날 아침 그는 깨어나 보니 자신이 외롭다는 것을 알게 되었다.", "use": "6. 부사적용법(결과)", "phrase": "to find himself lonely", "note": "깨어난 뒤 알게 된 결과", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-c4", "sec": "C-4", "en": "I called Amy to ask a favor.", "ko": "나는 부탁을 하기 위해 Amy에게 전화했다.", "use": "3. 부사적용법(목적)", "phrase": "to ask a favor", "note": "전화한 목적", "unitId": "u28", "unitTitle": "Unit28"}, {"id": "u28-c5", "sec": "C-5", "en": "She was pleased to meet her new teacher.", "ko": "그녀는 새 선생님을 만나서 기뻤다.", "use": "5. 부사적용법(원인)", "phrase": "to meet her new teacher", "note": "감정 pleased의 원인", "unitId": "u28", "unitTitle": "Unit28"}]}];
let currentUnitId='u27';
let currentIndex=0;
let mode='unit';
let wrongQueue=[];
let activeItem=null;
let locked=false;
let audioCtx=null;
let comboCount=0;
let dictLoaded=false;

const $=id=>document.getElementById(id);
function unitById(id){return UNITS.find(u=>u.id===id)}
function allItems(){return UNITS.flatMap(u=>u.items)}
function getItemById(id){return allItems().find(x=>x.id===id)}
function unique(a){return [...new Set(a)]}
function nowStr(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function getState(id){
  const u=unitById(id);
  const base={currentIndex:0, solved:[], wrongIds:[], lastTime:'', attempts:0, passed:false};
  try{return Object.assign(base, JSON.parse(localStorage.getItem(STORE+'_'+id)||'{}'))}catch(e){return base}
}
function setState(id,st){localStorage.setItem(STORE+'_'+id,JSON.stringify(st))}
function clearTabs(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))}
function showSec(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function pct(n,t){return t?Math.round(n/t*100):0}
function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function tone(f,t,d,v=.08){if(!audioCtx)return; const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function sfxOK(){initAudio(); tone(600,'sine',.1); setTimeout(()=>tone(830,'sine',.14),90)}
function sfxNG(){initAudio(); tone(260,'sawtooth',.2,.1)}
function boom(){if(typeof confetti==='function')confetti({particleCount:120,spread:70,origin:{y:.66}})}
function showCombo(text='OK!'){const el=$('combo');el.textContent=text;el.classList.remove('combo-pop');void el.offsetWidth;el.classList.add('combo-pop')}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tokens(s){return s.split(/\s+/).filter(Boolean)}
function norm(s){return s.replace(/[“”‘’]/g,"'").replace(/\s+/g,' ').trim()}

function showUnit(id,btn){
  currentUnitId=id; mode='unit'; clearTabs(); btn.classList.add('active'); showSec('quizSec');
  $('quizBox').style.display='none'; $('finishBox').style.display='none'; $('introCard').style.display='block';
  const u=unitById(id), st=getState(id);
  $('unitTitle').textContent=u.title+' · '+u.subtitle;
  $('unitSub').textContent=`저장된 진행: ${st.solved.length}/${u.items.length} · 남은 오답: ${st.wrongIds.length}개`;
}
function startCurrentUnit(){
  initAudio(); mode='unit'; const u=unitById(currentUnitId), st=getState(currentUnitId);
  let idx=st.currentIndex||0;
  if(st.solved.length<u.items.length){const f=u.items.findIndex(it=>!st.solved.includes(it.id)); idx=f>=0?f:Math.min(idx,u.items.length-1)}
  currentIndex=idx; $('introCard').style.display='none'; $('finishBox').style.display='none'; $('quizBox').style.display='block'; loadQuestion();
}
function showHistoryTab(btn){clearTabs();btn.classList.add('active');showSec('histSec');renderHistory()}
function showWrongTab(btn){clearTabs();btn.classList.add('active');showSec('wrongSec');renderWrong()}

function attachChip(c){
  c.onclick=function(){
    if(locked) return;
    const aa=$('answer-area'), sa=$('scramble-area');
    if(this.parentElement.id==='scramble-area') aa.appendChild(this); else sa.appendChild(this);
    if(sa.children.length===0) setTimeout(checkAnswer,40);
  };
}
function setupSortable(){
  if(!window.Sortable) return;
  if(!window._ds){
    window._ds=new Sortable($('answer-area'),{group:'words',animation:280,ghostClass:'sortable-ghost',dragClass:'sortable-drag',swapThreshold:.65,onEnd:()=>{if($('scramble-area').children.length===0)setTimeout(checkAnswer,50)}});
    window._ss=new Sortable($('scramble-area'),{group:'words',animation:280,ghostClass:'sortable-ghost',dragClass:'sortable-drag',swapThreshold:.65,onEnd:()=>{if($('scramble-area').children.length===0)setTimeout(checkAnswer,50)}});
  }
}
function loadQuestion(){
  locked=false; $('nextBtn').style.display='none'; $('resultBox').className='resultBox'; $('resultBox').innerHTML='';
  $('answer-area').style.background='#eef7ff'; $('answer-area').style.borderColor='var(--main)';
  const u=unitById(currentUnitId), list=mode==='wrong'?wrongQueue:u.items;
  if(!list.length){renderWrong();return}
  if(currentIndex>=list.length){finishUnitOrWrong();return}
  activeItem=mode==='wrong'?getItemById(list[currentIndex]):list[currentIndex];
  const uid=activeItem.unitId||currentUnitId, au=unitById(uid), st=getState(uid);
  const total=mode==='wrong'?list.length:au.items.length;
  $('qStatus').textContent=`${au.title} · ${currentIndex+1} / ${total} · ${activeItem.sec}`;
  $('qScore').textContent=`완료 ${st.solved.length}/${au.items.length} · 오답 ${st.wrongIds.length}`;
  $('progBar').style.width=pct(st.solved.length,au.items.length)+'%';
  $('koBox').textContent=activeItem.ko;
  $('usageBox').innerHTML=`<b>부정사 용법:</b> ${activeItem.use}<br><b>확인할 부분:</b> ${activeItem.phrase}<br><span style="font-size:13px;color:#755000">${activeItem.note||''}</span>`;
  $('answer-area').innerHTML=''; $('scramble-area').innerHTML='';
  shuffle(tokens(activeItem.en)).forEach(w=>{const c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=w; attachChip(c); $('scramble-area').appendChild(c);});
  setupSortable();
}
function checkAnswer(){
  if(locked || !activeItem) return;
  const student=[...$('answer-area').children].map(x=>x.textContent.trim()).join(' ');
  if(norm(student)===norm(activeItem.en)){
    locked=true; sfxOK(); showCombo('OK!'); $('answer-area').style.background='#e8fff4'; $('answer-area').style.borderColor='var(--green)';
    $('resultBox').className='resultBox ok'; $('resultBox').innerHTML='<div class="okMark">OK!</div><div>맞았어요. 다음 문제로 넘어가세요.</div>';
    saveCorrect(); $('nextBtn').style.display='block';
    [...document.querySelectorAll('.chip')].forEach(c=>c.style.pointerEvents='none');
  } else {
    sfxNG(); $('answer-area').style.background='#fff0f0'; $('answer-area').style.borderColor='var(--red)';
    $('resultBox').className='resultBox no'; $('resultBox').textContent='순서가 달라요. 다시 배열해 보세요.';
    saveWrong(activeItem);
    setTimeout(()=>{if(!locked){$('answer-area').style.background='#eef7ff';$('answer-area').style.borderColor='var(--main)';}},450);
  }
}
function saveCorrect(){
  const uid=activeItem.unitId||currentUnitId, u=unitById(uid), st=getState(uid);
  if(!st.solved.includes(activeItem.id)) st.solved.push(activeItem.id);
  if(mode==='unit'){
    const idx=u.items.findIndex(x=>x.id===activeItem.id);
    st.currentIndex=Math.min(idx+1,u.items.length);
  } else {
    st.wrongIds=st.wrongIds.filter(id=>id!==activeItem.id);
  }
  st.lastTime=nowStr(); st.attempts=(st.attempts||0)+1; st.passed=(st.solved.length===u.items.length && st.wrongIds.length===0); setState(uid,st);
}
function saveWrong(item){
  const uid=item.unitId||currentUnitId, st=getState(uid);
  if(!st.wrongIds.includes(item.id)) st.wrongIds.push(item.id);
  st.lastTime=nowStr(); setState(uid,st);
}
function nextQuestion(){
  if(mode==='wrong'){currentIndex++; currentIndex>=wrongQueue.length?finishUnitOrWrong():loadQuestion();}
  else {const st=getState(currentUnitId), u=unitById(currentUnitId); if(st.currentIndex>=u.items.length)finishUnitOrWrong(); else {currentIndex=st.currentIndex; loadQuestion();}}
}
function finishUnitOrWrong(){
  $('quizBox').style.display='none'; $('introCard').style.display='none'; $('finishBox').style.display='block';
  if(mode==='wrong'){
    const left=getAllWrongIds().length;
    $('finishBox').innerHTML=left===0?`<div class="finishIcon">🏆</div><div class="title">오답까지 완료!</div><div class="sub">남은 오답이 없습니다. 100점 통과입니다.</div><button class="primary" onclick="showHistoryTab($('tab-hist'))">기록 보기</button>`:`<div class="finishIcon">📝</div><div class="title">오답 풀이 종료</div><div class="sub">아직 남은 오답이 ${left}개 있습니다.</div><button class="primary" onclick="startWrongMode()">오답 계속 풀기</button>`; return;
  }
  const u=unitById(currentUnitId), st=getState(currentUnitId), score=st.passed?100:Math.max(0,Math.round((u.items.length-st.wrongIds.length)/u.items.length*100));
  if(st.passed){boom();}
  $('finishBox').innerHTML=st.passed?`<div class="finishIcon">🏆</div><div class="title">${u.title} 100점 통과!</div><div class="sub">모든 문장을 정확히 풀었습니다.</div><button class="primary" onclick="showHistoryTab($('tab-hist'))">기록 보기</button>`:`<div class="finishIcon">🌱</div><div class="title">${u.title} 완료 · 현재 ${score}점</div><div class="sub">오답 ${st.wrongIds.length}개를 다시 맞히면 100점 통과입니다.</div><button class="primary" onclick="showWrongTab($('tab-wrong'))">오답 풀러 가기</button>`;
}
function getAllWrongIds(){let ids=[]; UNITS.forEach(u=>ids=ids.concat(getState(u.id).wrongIds)); return unique(ids).filter(id=>getItemById(id));}
function renderHistory(){
  const h=$('histList'); h.innerHTML='';
  UNITS.forEach(u=>{
    const st=getState(u.id), total=u.items.length, done=st.solved.length, score=st.passed?100:Math.max(0,Math.round((total-st.wrongIds.length)/total*100));
    h.insertAdjacentHTML('beforeend',`<div class="histRow"><div style="flex:1"><b>${u.title} · ${u.subtitle}</b><br><span class="sub">완료 ${done}/${total} · 오답 ${st.wrongIds.length}개 · 현재 ${score}점<br>최근 기록: ${st.lastTime||'없음'}</span><div class="progress"><div class="bar" style="width:${pct(done,total)}%"></div></div></div><button class="smallBtn" onclick="resumeUnit('${u.id}')">${done?'이어풀기':'시작'}</button></div>`);
  });
  h.insertAdjacentHTML('beforeend',`<div class="histRow"><div><b>전체 오답</b><br><span class="sub">오답 탭에서 다시 풀 수 있습니다.</span></div><strong>${getAllWrongIds().length}개</strong></div>`);
}
function resumeUnit(id){showUnit(id,$('tab-'+id));startCurrentUnit()}
function renderWrong(){
  const ids=getAllWrongIds(), box=$('wrongList'); box.innerHTML='';
  if(!ids.length){box.innerHTML='<div class="card soft"><div class="title">오답 없음</div><div class="sub">틀린 문제가 없습니다.</div></div>'; return;}
  ids.forEach(id=>{const item=getItemById(id); box.insertAdjacentHTML('beforeend',`<div class="wrongRow"><div><b>${item.unitTitle} · ${item.sec}</b><br><span class="sub">${item.ko}<br>${item.use}</span></div><button class="smallBtn" onclick="startWrongMode('${id}')">풀기</button></div>`);});
  box.insertAdjacentHTML('beforeend','<button class="primary" onclick="startWrongMode()">오답 전체 순서대로 풀기</button>');
}
function startWrongMode(firstId=null){
  initAudio(); mode='wrong'; wrongQueue=getAllWrongIds();
  if(firstId){const i=wrongQueue.indexOf(firstId); if(i>0) wrongQueue=[...wrongQueue.slice(i),...wrongQueue.slice(0,i)];}
  currentIndex=0; clearTabs(); $('tab-wrong').classList.add('active'); showSec('quizSec'); $('introCard').style.display='none'; $('finishBox').style.display='none'; $('quizBox').style.display='block'; loadQuestion();
}
function resetAll(){if(confirm('모든 기록과 오답을 초기화할까요?')){UNITS.forEach(u=>localStorage.removeItem(STORE+'_'+u.id)); renderHistory();}}
showUnit('u27',$('tab-u27'));
</script>
