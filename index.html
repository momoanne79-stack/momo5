: "그때 이후로, 할머니는 걷는 데 어려움을 겪어 오셨어요.", "sentence": "Since then, she has [having / had] trouble [walked / walking].", "answer": ["had", "walking"], "explain": "현재완료 has had가 맞고, have trouble -ing는 '~하는 데 어려움을 겪다'라는 표현이므로 walking이 맞습니다."}, {"ko": "그녀는 자주 쉬어야 하는데, 길거리에는 벤치가 많지 않아요.", "sentence": "She often needs [resting / to rest], but there [are / is] not many benches on the streets.", "answer": ["to rest", "are"], "explain": "need to 동사원형 구조이므로 to rest가 맞습니다. many benches가 복수이므로 there are가 맞습니다."}, {"ko": "Sitbag은 어르신들을 위해 설계되었어요.", "sentence": "The Sitbag is [designing / designed] for elderly people like her.", "answer": "designed", "explain": "Sitbag이 설계되는 대상이므로 수동태 is designed가 맞습니다."}, {"ko": "그것은 어르신들께 정말 유용할 거예요.", "sentence": "It will be really [helpfully / helpful] for the elderly.", "answer": "helpful", "explain": "be동사 뒤 보어 자리에는 형용사 helpful이 옵니다. helpfully는 부사입니다."}, {"ko": "여기 우리의 마지막 발명가가 있습니다.", "sentence": "Now, here [are / is] our final inventor.", "answer": "is", "explain": "주어 our final inventor가 단수이므로 here is가 맞습니다."}, {"ko": "저는 그것이 큰 문제라고 생각했어요.", "sentence": "I thought it [was / will be] a big problem.", "answer": "was", "explain": "thought와 시제를 맞추어 과거형 was가 자연스럽습니다."}, {"ko": "엄마가 오래된 정수기 필터를 버리고 계셨어요.", "sentence": "My mom was [throwing / thrown] away old water filters.", "answer": "throwing", "explain": "과거진행형 was + -ing 구조입니다."}, {"ko": "저는 그것들을 미술실에서 쓸 수 있다고 생각했어요.", "sentence": "At that moment, I thought I [can / could] use them in the art rooms.", "answer": "could", "explain": "thought가 과거이므로 종속절의 조동사도 could로 쓰는 것이 자연스럽습니다."}, {"ko": "그것은 더러운 물감 물을 정화하기 위해 오래된 정수 필터를 사용해요.", "sentence": "It uses old water filters [to clean / clean] the dirty paint water.", "answer": "to clean", "explain": "'정화하기 위해'라는 목적을 나타내는 to부정사입니다."}, {"ko": "오늘, 우리는 몇몇 창의적인 아이디어들을 만났습니다.", "sentence": "Today, we’ve [seeing / seen] some creative ideas.", "answer": "seen", "explain": "현재완료 have + 과거분사 구조입니다. see의 과거분사는 seen입니다."}, {"ko": "이 십 대들은 문제에 집중하고 해결책들을 생각해 냈죠.", "sentence": "These teenagers have [focused / focusing] on problems and [coming / come] up with solutions.", "answer": ["focused", "come"], "explain": "현재완료 have focused and come up with 구조입니다. 두 동사가 과거분사로 병렬 연결되었습니다."}, {"ko": "그들의 발명품들이 우리 세상을 더 나은 곳으로 만들어 주길 바랍니다.", "sentence": "I hope their inventions will [be made / make] our world better.", "answer": "make", "explain": "make + 목적어 + 목적격보어 구조입니다. inventions가 our world를 더 좋게 만드는 것이므로 능동형 make가 맞습니다."}];
let selectedEnglishVoice=null;
function loadEnglishVoice(){ if(!('speechSynthesis' in window))return; const voices=speechSynthesis.getVoices(); selectedEnglishVoice=voices.find(v=>(v.lang==='en-US'||v.lang==='en_US')&&/samantha|alex|ava|allison|nicky|english/i.test(v.name))||voices.find(v=>v.lang==='en-US'||v.lang==='en_US')||null; }
if('speechSynthesis' in window){loadEnglishVoice(); speechSynthesis.onvoiceschanged=loadEnglishVoice;}
function speak(t,rate=0.78,onend=null){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); loadEnglishVoice(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=rate; u.pitch=1; if(selectedEnglishVoice)u.voice=selectedEnglishVoice; if(onend)u.onend=onend; speechSynthesis.speak(u); }
function show(id,btn){stopReading(); if(id!=='dict') stopDictLoop(); document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active'); if(id==='dict'){ if(!dictLoaded){loadDict();dictLoaded=true;} startDictLoop(); } if(id==='gram'&&!gramLoaded){loadGrammar();gramLoaded=true;}}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');}
function save(key,val){localStorage.setItem(STORE+'_'+key,JSON.stringify(val));}
function load(key,def){try{return JSON.parse(localStorage.getItem(STORE+'_'+key))??def}catch(e){return def}}
function rec(type,data){let h=load('history',[]);h.unshift({type,time:new Date().toLocaleString('ko-KR'),...data});save('history',h.slice(0,80));}
function evo(prefix,cur,total){const stages=[['🥚','수상한 알'],['🐣','깨어나는 병아리'],['🦎','민첩한 도마뱀'],['🦖','힘센 공룡'],['🐲','비상 준비'],['🕊️','평화 비둘기'],['🦅','독수리 집중력'],['🐦‍⬛','검은 새 마스터'],['🐦','거대 비둘기 진화']];let pct=total?Math.floor(cur/total*100):0;let idx=Math.min(stages.length-1,Math.floor((pct/100)*(stages.length-1)));document.getElementById(prefix+'e').textContent=stages[idx][0];document.getElementById(prefix+'n').textContent=stages[idx][1]+` (${pct}%)`;document.getElementById(prefix+'b').style.width=pct+'%';}
function initPassage(){const wrap=document.getElementById('passageWrap');wrap.innerHTML=passageParts.map((p,i)=>`<div class="card" id="ps${i}"><span class="speaker">${p[0]}:</span>${p[1]}</div>`).join('');}
let readIdx=0, readRep=0, reading=false, paused=false;
function startReading(){reading=true;paused=false;readIdx=0;readRep=0;readNext();}
function readNext(){if(!reading||paused)return;if(readIdx>=sentences.length){document.getElementById('listenStatus').textContent='✅ 전체 듣기 완료';reading=false;return;}document.querySelectorAll('.card').forEach(c=>c.classList.remove('currentSentence'));document.getElementById('listenStatus').textContent=`본문 듣기: ${readIdx+1}/${sentences.length} 문장 · ${readRep+1}/3회`;speak(sentences[readIdx].en,0.72,()=>{if(!reading||paused)return;readRep++;if(readRep>=3){readRep=0;readIdx++;}setTimeout(readNext,350);});}
function pauseResume(){if(!reading){startReading();return;} if(!paused){paused=true;speechSynthesis.cancel();document.getElementById('pauseBtn').textContent='▶ 이어듣기';}else{paused=false;document.getElementById('pauseBtn').textContent='⏸ 일시정지';readNext();}}
function stopReading(){reading=false;paused=false;if('speechSynthesis'in window)speechSynthesis.cancel();let p=document.getElementById('pauseBtn');if(p)p.textContent='⏸ 일시정지';}
let wArr=[],wIdx=0,wOk=0,wBusy=false;
function startWord(){wArr=shuffle(wordList);wIdx=0;wOk=0;document.getElementById('wordIntro').style.display='none';document.getElementById('wordResult').style.display='none';document.getElementById('wordQuiz').style.display='block';loadWord();}
function loadWord(){wBusy=false;evo('w',wIdx,wArr.length);let q=wArr[wIdx];document.getElementById('wStatus').textContent=`${wIdx+1}/${wArr.length}`;document.getElementById('wEn').textContent=q.en;speak(q.en);let opts=shuffle([q.ko,...shuffle(wordList.filter(x=>x.ko!==q.ko)).slice(0,3).map(x=>x.ko)]);document.getElementById('wOpts').innerHTML=opts.map(o=>`<button class="opt" onclick="pickWord(this,'${encodeURIComponent(o)}')">${o}</button>`).join('');}
function pickWord(btn,enc){if(wBusy)return;wBusy=true;let ans=decodeURIComponent(enc);let q=wArr[wIdx];let ok=ans===q.ko;if(ok){wOk++;btn.classList.add('correct');}else{btn.classList.add('wrong');saveWrong(q);[...document.querySelectorAll('#wOpts .opt')].find(b=>b.textContent===q.ko)?.classList.add('correct');}setTimeout(()=>{wIdx++;if(wIdx<wArr.length)loadWord();else finishWord();},800);}
function finishWord(){evo('w',wArr.length,wArr.length);document.getElementById('wordQuiz').style.display='none';let score=Math.round(wOk/wArr.length*100);document.getElementById('wordResult').style.display='block';document.getElementById('wordResult').innerHTML=`<div class="wordDisplay">${score}점</div><p>정답 ${wOk}/${wArr.length}</p><button class="btn" onclick="startWord()">다시 하기</button>`;rec('단어',{score,detail:`${wOk}/${wArr.length}`});if(score>=90)confetti();}
let dIdx=0,dictLoaded=false,rateIdx=0,dictAuto=false,dictLoopTimer=null;const rates=[0.78,0.62,0.5],rateNames=['미국식 보통','느리게','아주 느리게'];
function cleanWords(s){return s.replace(/[“”".,!?;:()]/g,'').split(/\s+/).filter(Boolean)}
function loadDict(){evo('d',dIdx,sentences.length);let s=sentences[dIdx];document.getElementById('dStatus').textContent=`영작 ${dIdx+1}/${sentences.length}`;document.getElementById('dKo').textContent=s.ko;document.getElementById('answer').innerHTML='';document.getElementById('scramble').innerHTML='';shuffle(cleanWords(s.en)).forEach(w=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{(b.parentElement.id==='scramble'?document.getElementById('answer'):document.getElementById('scramble')).appendChild(b);if(!document.getElementById('scramble').children.length)checkDict();};document.getElementById('scramble').appendChild(b);}); if(!window.sortable){window.sortable=new Sortable(document.getElementById('answer'),{animation:200,onEnd:()=>{if(!document.getElementById('scramble').children.length)checkDict();}})} startDictLoop();}
function checkDict(){let stu=[...document.getElementById('answer').children].map(x=>x.textContent).join(' ');if(norm(stu)===norm(sentences[dIdx].en)){stopDictLoop();document.getElementById('answer').style.background='#e7f8ee';rec('영작',{detail:`${dIdx+1}번 문장 완료`});save('dictProgress',{idx:dIdx+1,total:sentences.length,time:new Date().toLocaleString('ko-KR')});setTimeout(()=>{dIdx++; if(dIdx<sentences.length){document.getElementById('answer').style.background='#f8fcff';loadDict();}else{stopDictLoop();evo('d',sentences.length,sentences.length);confetti();alert('영작 완료!');}},700);}else{document.getElementById('answer').style.background='#fde8e8';setTimeout(()=>document.getElementById('answer').style.background='#f8fcff',500);}}
function dictLoopPlay(){if(!dictAuto||!sentences[dIdx])return;speak(sentences[dIdx].en,rates[rateIdx],()=>{if(dictAuto)dictLoopTimer=setTimeout(dictLoopPlay,650);});}
function startDictLoop(){clearTimeout(dictLoopTimer);dictAuto=true;updateDictPlayBtn();dictLoopPlay();}
function stopDictLoop(){dictAuto=false;clearTimeout(dictLoopTimer);if('speechSynthesis'in window)speechSynthesis.cancel();updateDictPlayBtn();}
function toggleDictLoop(){if(dictAuto)stopDictLoop();else startDictLoop();}
function updateDictPlayBtn(){let b=document.getElementById('dictPlayBtn');if(b)b.textContent=dictAuto?'⏸ 자동 반복 멈춤':'▶️ 자동 반복 재생';}
function playCurrent(){startDictLoop();}
function toggleSpeed(){rateIdx=(rateIdx+1)%rates.length;document.getElementById('speedBtn').textContent=rateNames[rateIdx];if(dictAuto)startDictLoop();}
let gIdx=0,gramLoaded=false,gChecked=false,gSelected={};
function renderGrammarSentence(raw){let idx=0;return raw.replace(/\[([^\]]+)\]/g,(m,inside)=>{idx++;let parts=inside.split('/').map(x=>x.trim());return parts.map(p=>`<button class="gChoice" data-g="${idx}" data-val="${p}" onclick="selectG(this)">${p}</button>`).join(' ');});}
function loadGrammar(){gChecked=false;gSelected={};evo('g',gIdx,grammarList.length);let q=grammarList[gIdx];document.getElementById('gStatus').textContent=`어법 ${gIdx+1}/${grammarList.length}`;document.getElementById('gKo').textContent=q.ko;document.getElementById('gSentence').innerHTML=renderGrammarSentence(q.sentence);document.getElementById('gExplain').classList.remove('show');document.getElementById('gExplain').innerHTML='';document.getElementById('gNext').style.display='none';}
function selectG(btn){if(gChecked)return;let group=btn.dataset.g;document.querySelectorAll(`.gChoice[data-g="${group}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');gSelected[group]=btn.dataset.val;}
function checkGrammar(){let q=grammarList[gIdx];let answers=Array.isArray(q.answer)?q.answer:[q.answer];let total=answers.length;let okCount=0;for(let i=1;i<=total;i++){let sel=gSelected[String(i)];if(sel===answers[i-1])okCount++;document.querySelectorAll(`.gChoice[data-g="${i}"]`).forEach(b=>{if(b.dataset.val===answers[i-1])b.classList.add('correct');else if(b.classList.contains('selected'))b.classList.add('wrong');});}gChecked=true;document.getElementById('gExplain').innerHTML=`<b>${okCount===total?'⭕ 정답':'❌ 다시 확인'}</b><br>${q.explain}`;document.getElementById('gExplain').classList.add('show');document.getElementById('gNext').style.display='block';rec('어법',{detail:`${gIdx+1}번 ${okCount}/${total}`});}
function nextGrammar(){gIdx++;if(gIdx<grammarList.length)loadGrammar();else{evo('g',grammarList.length,grammarList.length);confetti();alert('어법 훈련 완료!');}}
function saveWrong(w){let arr=load('wrong',[]);if(!arr.find(x=>x.en===w.en)){arr.push(w);save('wrong',arr);}}
function renderWrong(){let arr=load('wrong',[]);document.getElementById('wrongList').innerHTML=arr.length?arr.map((w,i)=>`<div class="wrongItem"><div><b>${w.en}</b><br><span class="small">${w.ko}</span></div><button onclick="delWrong(${i})">삭제</button></div>`).join(''):'<div class="card">오답 단어가 없습니다.</div>';}
function delWrong(i){let arr=load('wrong',[]);arr.splice(i,1);save('wrong',arr);renderWrong();}
function clearWrong(){save('wrong',[]);renderWrong();}
function renderHistory(){let h=load('history',[]), dp=load('dictProgress',null);let html='';if(dp)html+=`<div class="histCard"><b>영작 진행</b><br>${dp.idx}/${dp.total}번 문장까지 완료<br><span class="small">${dp.time}</span></div>`;html+=h.length?h.slice(0,30).map(x=>`<div class="histCard"><b>${x.type}</b> ${x.score!==undefined?x.score+'점':''}<br>${x.detail||''}<br><span class="small">${x.time}</span></div>`).join(''):'<div class="card">아직 기록이 없습니다.</div>';document.getElementById('histList').innerHTML=html;}
initPassage();
</script></body></html>
